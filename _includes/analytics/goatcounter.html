<!--
  ============================================================
  【本文件是什么？】
  本文件故意留空 · 用于屏蔽 Chirpy 自带的 GoatCounter 统计脚本
  ------------------------------------------------------------
  一句话概括：这是一个"空壳文件"，用"占着位置但什么都不放"的方式，
  悄悄关掉主题自带的国外统计脚本，让国内访客打开网页更快。

  为什么要想出这个招数？分三步理解：

  第 1 步：Chirpy 主题的逻辑是——只要 _config.yml 里
          analytics.goatcounter.id 非空，就会在网页头部加载本文件，
          也就是注入 https://gc.zgo.at/count.js（一个境外地址）。
  第 2 步：而这个境外地址在国内加载很慢、经常超时，
          还会拖慢整个网站第一屏的显示速度。
  第 3 步：但那个 id 又不能清空！因为 Chirpy 正是靠"id 是否为空"
          来判断要不要在文章标题下面显示「阅读量」这个元素。
          一旦清空，阅读量整个位置都会消失。

  所以最终采用的办法就是：
     保留非空 id（让主题以为统计功能开着，照常生成阅读量位置）
     + 把本文件覆盖为空（让主题加载不到任何真实脚本）
     = 既能显示阅读量，又完全不加载 GoatCounter 的任何资源。

  那真正的阅读量数字从哪来？
     由 _includes/pageviews/goatcounter.html（结合不蒜子 + _data/views.json）实现。
     两者文件名相同但目录不同，各管一件事，互不干扰。

  【要不要改动本文件？】
     不需要。请保持本文件为空，改了反而会导致境外脚本被加载。
     想彻底停用，请去 _config.yml 把 analytics.goatcounter.id 留空，
     但那样阅读量位置也会一并消失，请按需取舍。
  ============================================================
-->
