<!--
  ============================================================================
  【本文件是什么？】
  这是 Chirpy 主题官方预留的「自定义注入点」——主题在生成每个页面时，
  都会在 </head> 结束标签之前自动插入本文件的内容。
  它的存在意义就是：让使用者可以往页面里补充自己的东西，而不用去改主题源代码。

  【为什么写在这里，而不是直接改主题的 CSS？】
  因为主题的样式文件在 gem 包里（不在本项目里），改不了；
  就算能改，下次升级主题也会被覆盖掉。而放在这里，永远属于"你自己的文件"，
  升级主题不受影响 —— 这是官方推荐的做法。

  【2026-10-27 精简改动】
  原来这里用 <link> 引一个独立的 assets/css/custom-footer.css（3.6 KB），
  但那个文件实际生效的样式只有十几行，为了十几行 CSS 让每个页面都多跑一趟
  "请求→等待→下载"，不划算（阻塞渲染的样式表越少，首屏越快）。
  所以改成下面的 <style> 直接内联，并删掉了那个 .css 文件：
      改动前：7 个阻塞样式表；改动后：6 个。
  内联后 HTML 只多了约 0.6 KB，gzip 压缩后几乎无感，净赚一次网络往返。

  【可DIY修改】以后想加别的自定义样式，直接写在下面 <style> 里；
  如果样式变多了（超过 5 KB），再拆回独立 .css 文件更合适。
  ============================================================================
-->

<style>
  /* -------------------------------------------------------------------------
     ① 修掉「页脚内容顶到横线」—— 让页脚高度不再写死
     -------------------------------------------------------------------------
     【问题现象】手机上页脚第一行紧贴/压住了顶部那根分隔线。

     【根本原因】Chirpy 主题给页脚设了「固定高度」：电脑端 5rem、手机端 6rem。
       页脚原本只有三行文字，高度刚好够用；加上"运行天数"后手机端内容变多、
       超过固定的 6rem，多出来的部分就往上溢出，把第一行顶到了那根线上。

     【解决办法】把高度从"写死"改成"至少这么高，内容多了自动撑开"：
       height: 6rem → min-height: 6rem（手机上 6rem 起，可继续变高）
       height: 5rem → min-height: 5rem（电脑上 5rem 起）
     这样内容再多也只会把页脚"撑高"，而不会"顶出来"，横线就恢复正常。

     ★ 手机端原本带 padding: 1.5rem 0，6rem 高度里光留白就占 3rem，
       只剩 3rem 装三行文字，非常挤；这里把上下留白收窄到 0.75rem 让给文字。
     ★ 只改高度和留白，没有动那根 border-top 横线本身，它原样保留。
     ------------------------------------------------------------------------- */
  footer {
    height: auto;       /* 取消主题写死的固定高度 */
    min-height: 5rem;   /* 电脑端：至少 5rem 高（与主题原值一致） */
  }

  @media (max-width: 849.98px) {
    /* 850px 是主题自己用的窄屏分界值，保持一致最稳妥 */
    footer {
      min-height: 6rem;     /* 手机端：至少 6rem 高（与主题原值一致） */
      padding: 0.75rem 0;   /* 上下留白收窄，把省下的高度让给文字 */
    }
  }

  /* -------------------------------------------------------------------------
     ② 运行天数那一小段本身：不许从中间断开
     避免数字和"天"字被拆到两行、看起来莫名其妙。
     颜色、字号自动继承页脚，不用重复设置。
     ------------------------------------------------------------------------- */
  .footer-run-days {
    white-space: nowrap;
  }
</style>

<!--
  ============================================================================
  预连接（preconnect）：提前和"马上要用到的第三方服务器"握手，
  等真正去取资源时就不用再花这几十毫秒。

  【2026-10-27 改动】原来是写死 q0.itc.cn 和 q4.itc.cn 两个域名，
  但站内 269 张配图分散在 q0~q9 共 10 个子域名上（每个域名几十张），
  写死两个命中率不到 10%，没命中反而白占一个连接槽。
  改成按"当前这篇文章的首图地址"自动取域名，命中率 100%；
  首页、归档等没有首图的页面则不输出，不浪费任何连接。
  ============================================================================
-->
{%- if page.image and page.image != '' -%}
  {%- assign _img_host = page.image | remove_first: 'https://' | remove_first: 'http://' | split: '/' | first -%}
  {%- if _img_host != '' and _img_host != nil -%}
<link rel="preconnect" href="https://{{ _img_host }}" crossorigin>
  {%- endif -%}
{%- endif -%}

<!-- 评论区（Twikoo）是交互功能，点开就要用，值得稳定预连接 -->
<link rel="preconnect" href="https://twikoo.2019527.xyz" crossorigin>
