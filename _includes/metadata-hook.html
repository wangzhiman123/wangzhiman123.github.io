<!--
  ============================================================================
  【本文件是什么？】
  这是 Chirpy 主题官方预留的「自定义注入点」——主题在生成每个页面时，
  都会在 </head> 结束标签之前自动插入本文件的内容。
  它的存在意义就是：让使用者可以往页面里补充自己的东西，而不用去改主题源代码。

  【为什么用这种方式加载自定义样式，而不是直接改主题的 CSS？】
  因为主题的样式文件在 gem 包里（不在本项目里），改不了；
  就算能改，下次升级主题就会被覆盖掉。而放在这里，永远属于"你自己的文件"，
  升级主题不受影响 —— 这是官方推荐的做法。

  【本文件目前做了什么？】
  加载一个自定义样式文件 assets/css/custom-footer.css，
  里面主要修一件事：手机上页脚内容被顶到顶部横线的问题（详见该文件内的说明）。

  【可DIY修改】以后想加别的自定义 CSS，继续写在那个文件里即可，这里不用动。
  如果还想在这个位置加别的东西（例如统计代码、meta 标签），加在下面这行之后就行。
  ============================================================================
-->

<!-- 自定义补充样式（主要修页脚在手机端"顶到横线"的问题） -->
<link rel="stylesheet" href="/assets/css/custom-footer.css">

<!-- 利用浏览器的 preconnect（预连接） 提示，提前与第三方服务器建立网络连接，以节省后续加载资源的时间 -->
<link rel="preconnect" href="https://q0.itc.cn" crossorigin>
<link rel="preconnect" href="https://q4.itc.cn" crossorigin>
<link rel="preconnect" href="https://twikoo.2019527.xyz" crossorigin>
