<!--
  ============================================================
  阅读量统计 · 不蒜子版 v5（详情页实时计数）
  ------------------------------------------------------------
  用途：覆盖 Chirpy 主题自带的 _includes/pageviews/goatcounter.html

  为什么又换回不蒜子：
    Vercount 的 cn 节点接口正常但不返回 CORS 头，浏览器 fetch
    会被跨域策略拦截；全球节点有 CORS 但接口返回 500。
    不蒜子使用 JSONP（script 标签加载），**不受 CORS 限制**，
    且服务器在国内，实测 1.2 秒返回，已确认能取到真实数据。

  工作方式：
    1. 动态插入 script 标签，请求不蒜子 JSONP 接口
    2. 强制 referrerPolicy = no-referrer-when-downgrade
       （必须！否则浏览器只发域名不发路径，所有文章会共用一个数）
    3. 拿到 page_pv 后写入 #pageviews，并做千分位格式化
    4. 三层兜底：请求失败 / 6 秒超时 / 9 秒硬兜底 —— 绝不停在转圈

  配套配置（_config.yml，保持不变）：
      analytics.goatcounter.id: busuanzi      ← 非空占位值即可
      pageviews.provider:       goatcounter
  同时保留 _includes/analytics/goatcounter.html 空文件，
  屏蔽境外脚本 gc.zgo.at/count.js。

  注：首页卡片的浏览量由 GitHub Actions 定时写入 _data/views.json，
      构建时静态渲染，与详情页共用不蒜子同一套数据。
  ============================================================
-->
<script>
(function () {
  "use strict";

  var API = "https://busuanzi.ibruce.info/busuanzi?jsonpCallback=";
  var REQ_TIMEOUT = 6000;  // 单次请求超时
  var HARD_TIMEOUT = 9000; // 硬兜底：到点必须有数字
  var POLL_MAX = 50;       // 元素未渲染时的最大轮询次数（约 10 秒）

  var finished = false;
  var pending = null;
  var el = null;

  function fmt(n) {
    try {
      return Number(n).toLocaleString("en-US");
    } catch (e) {
      return String(n);
    }
  }

  function find() {
    if (!el) {
      el = document.getElementById("pageviews");
    }
    return el;
  }

  function render(v) {
    if (finished || v === null || v === undefined) return;
    var e = find();
    if (!e) {
      pending = v; // 元素还没出现，先存着
      return;
    }
    finished = true;
    e.textContent = fmt(v);
  }

  function load() {
    var cb = "BszCallback_" + Math.random().toString(36).slice(2, 10);
    var done = false;

    window[cb] = function (d) {
      if (done) return;
      done = true;
      try {
        delete window[cb];
      } catch (e) {
        window[cb] = undefined;
      }
      var v = d && typeof d.page_pv === "number" ? d.page_pv : null;
      render(v === null ? 1 : v);
    };

    var s = document.createElement("script");
    s.src = API + cb;
    s.async = true;
    // 关键：保证跨域请求带上完整 URL 作为 Referer，否则每篇文章会共用一个计数
    try {
      s.referrerPolicy = "no-referrer-when-downgrade";
    } catch (e) {
      /* 老浏览器忽略 */
    }
    s.onerror = function () {
      if (done) return;
      done = true;
      render(1);
    };

    (document.head || document.documentElement).appendChild(s);

    setTimeout(function () {
      if (done) return;
      done = true;
      render(1);
    }, REQ_TIMEOUT);
  }

  function poll() {
    var n = 0;
    var t = setInterval(function () {
      if (finished) {
        clearInterval(t);
        return;
      }
      if (pending !== null) render(pending);
      if (finished) {
        clearInterval(t);
        return;
      }
      if (++n >= POLL_MAX) {
        clearInterval(t);
        render(1);
      }
    }, 200);
  }

  function init() {
    if (!find()) {
      poll();
      return;
    }
    if (pending !== null) render(pending);
  }

  load();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  // 硬兜底：到点仍无数字就直接填 1，永远不会停在转圈状态
  setTimeout(function () {
    if (finished) return;
    var e = find();
    if (e) {
      finished = true;
      e.textContent = "1";
    }
  }, HARD_TIMEOUT);
})();
</script>
