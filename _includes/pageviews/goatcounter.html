<!--
  ============================================================
  阅读量统计 · Vercount 版 v4
  ------------------------------------------------------------
  用途：覆盖 Chirpy 主题自带的 _includes/pageviews/goatcounter.html

  为什么从「不蒜子」换成 Vercount：
    不蒜子只按 Referer 统计当前页面，无法在首页列表查询每篇
    文章的计数；Vercount 是不蒜子的开源兼容替代（自动同步不蒜子
    数据），支持按 URL 参数查询任意页面，首页卡片和文章详情页
    因此能共用同一套数据。

  工作方式：
    1. 页面打开后立即 POST https://cn.vercount.one/api/v2/log
       （记录一次访问，同时返回最新计数）
    2. cn 节点失败自动切换 vercount.one 全球节点
    3. 三层兜底：接口 6 秒超时 / 请求失败 / 9 秒硬兜底 ——
       无论网络如何，最多 9 秒必定显示数字，绝不会一直转圈
    4. 数据未返回前保留 Chirpy 原生转圈图标作为加载态

  配套配置（_config.yml，保持不变）：
      analytics.goatcounter.id: busuanzi      ← 非空占位值即可
      pageviews.provider:       goatcounter
  同时保留 _includes/analytics/goatcounter.html 空文件，
  屏蔽境外脚本 gc.zgo.at/count.js。
  ============================================================
-->
<script>
(function () {
  "use strict";

  var HOSTS = ["https://cn.vercount.one", "https://vercount.one"];
  var REQ_TIMEOUT = 6000;   // 单次请求超时
  var HARD_TIMEOUT = 9000;  // 硬兜底：到点必须有数字，绝不留转圈
  var POLL_MAX = 50;        // 查找 #pageviews 的最大轮询次数（约 10 秒）

  var finished = false;  // 是否已经写入过数字
  var pending = null;    // 已取到值、但页面元素还没渲染出来时先存在这
  var el = null;

  function fmt(n) {
    try {
      return Number(n).toLocaleString("en-US");
    } catch (e) {
      return String(n);
    }
  }

  function find() {
    if (!el) {
      el = document.getElementById("pageviews");
    }
    return el;
  }

  function render(v) {
    if (finished || v === null || v === undefined) return;
    var e = find();
    if (!e) {
      pending = v; // 元素还没出现，先存着
      return;
    }
    finished = true;
    e.textContent = fmt(v);
  }

  // 向指定节点 POST 一次访问记录
  function post(host, onOk, onFail) {
    var timer = null;
    var ctrl = null;
    try {
      ctrl = new AbortController();
    } catch (e) {
      ctrl = null; // 老浏览器不支持就放弃超时中断，靠硬兜底
    }

    fetch(host + "/api/v2/log", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: location.href }),
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (timer) clearTimeout(timer);
        var v = d && d.data && typeof d.data.page_pv === "number" ? d.data.page_pv : null;
        onOk(v !== null ? v : 1);
      })
      .catch(function () {
        if (timer) clearTimeout(timer);
        onFail();
      });

    if (ctrl) {
      timer = setTimeout(function () {
        ctrl.abort();
      }, REQ_TIMEOUT);
    }
  }

  // 依次尝试各节点，全部失败则兜底显示 1
  function fetchCount() {
    (function tryHost(i) {
      if (i >= HOSTS.length) {
        render(1);
        return;
      }
      post(HOSTS[i], render, function () {
        tryHost(i + 1);
      });
    })(0);
  }

  // 元素迟迟不出现时反复尝试
  function poll() {
    var n = 0;
    var t = setInterval(function () {
      if (finished) {
        clearInterval(t);
        return;
      }
      if (pending !== null) {
        render(pending);
      }
      if (finished) {
        clearInterval(t);
        return;
      }
      if (++n >= POLL_MAX) {
        clearInterval(t);
        render(1);
      }
    }, 200);
  }

  function init() {
    if (!find()) {
      poll();
      return;
    }
    if (pending !== null) {
      render(pending);
    }
  }

  fetchCount(); // 立刻发请求，不等 DOM

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  // 硬兜底：到点仍无数字就直接填 1，永远不会停在转圈状态
  setTimeout(function () {
    if (finished) return;
    var e = find();
    if (e) {
      finished = true;
      e.textContent = "1";
    }
  }, HARD_TIMEOUT);
})();
</script>
