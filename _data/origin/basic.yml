# ============================================================
# basic.yml（自托管资源路径表）
# ------------------------------------------------------------
# 【这个文件干什么用】
#   网站在显示时会用到一些"公共零件"：字体、图标库、目录插件、
#   搜索插件等等。默认情况下这些零件是从国外的公共服务器
#   （cdn.jsdelivr.net）下载的，国内访问经常很慢甚至打不开，
#   结果就是"图标变成方框""目录按钮按了没反应"。
#
#   把 _config.yml 里的 assets.self_host.enabled 设为 true 后，
#   网站就不再从国外取这些零件，而是从自己仓库的
#   assets/self-host/ 文件夹里取（随网站一起发布），速度立刻快起来。
#
#   这个文件就是"每个零件从哪儿取"的地址清单。
#
# 【运行效果】
#   网页打开更快、图标和目录功能稳定显示，不再依赖国外 CDN。
#
# 【怎么改】
#   一般不需要动。只有当您下载了某个插件的同版本文件、想换成自托管时，
#   才把对应的地址改成本地路径（以 / 开头，指向网站里真实存在的文件）。
# ============================================================

# ---------- 字体 ----------
# 网站正文使用的网页字体（把字形文件打包成一份 css 一次取完）。
webfonts: /assets/self-host/fonts/main.css

# ---------- 各类插件库 ----------
# 下面每一段都是"某个插件需要的文件清单"，
# css 是样式文件，js 是脚本文件。:LOCALE 是一个会被自动替换的占位符，
# 表示"根据网站语言换成对应的语言文件"（例如中文会换成 zh-cn）。

# 文章右侧的自动目录（点击能跳到文章某一段）
toc:
  css: /assets/self-host/tocbot/tocbot.min.css
  js: /assets/self-host/tocbot/tocbot.min.js

# 图标库：网页上所有的小图标（眼睛、标签、文件夹等）都来自它
fontawesome:
  css: /assets/self-host/fontawesome-free/css/all.min.css

# 搜索框功能（输入关键词实时筛选文章）
search:
  js: /assets/self-host/simple-jekyll-search/simple-jekyll-search.min.js

# 流程图插件（本站暂未使用，故仍保留国外镜像地址；
# 【可DIY修改】将来要在文章里画流程图，可下载后改为本地路径）
mermaid:
  js: https://gcore.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

# 时间显示插件：把"2026-01-01"这种时间显示成"3天前"等更人性化的说法
dayjs:
  js:
    common: /assets/self-host/dayjs/dayjs.min.js
    # :LOCALE 会被替换成网站语言，例如 zh-cn
    locale: /assets/self-host/dayjs/locale/:LOCALE.js
    # 相对时间插件：用来显示"3天前""2小时前"
    relativeTime: /assets/self-host/dayjs/plugin/relativeTime.js
    # 本地化格式插件：让日期按当地习惯来写
    localizedFormat: /assets/self-host/dayjs/plugin/localizedFormat.js

# 图片灯箱插件：点击文章里的图片会放大成"浮层大图"、可左右切换
glightbox:
  css: /assets/self-host/glightbox/glightbox.min.css
  js: /assets/self-host/glightbox/glightbox.min.js

# 图片懒加载兼容插件：让老浏览器也能支持"图片滚到眼前才加载"
lazy-polyfill:
  css: /assets/self-host/loading-attribute-polyfill/loading-attribute-polyfill.min.css
  js: /assets/self-host/loading-attribute-polyfill/loading-attribute-polyfill.umd.min.js

# 一键复制插件：文章里代码块右上角的"复制"按钮就是它
clipboard:
  js: /assets/self-host/clipboard/clipboard.min.js

# 数学公式插件（本站暂未使用，保留国外镜像地址，理由同上面的 mermaid）
mathjax:
  js: https://gcore.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
