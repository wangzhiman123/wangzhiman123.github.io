# ============================================================
# authors.yml —— 作者名片（作者档案）
# ------------------------------------------------------------
# 【这个文件干什么用】
#   网站上的文章可以署作者名。为了让"作者名"能变成可点击的链接、
#   并且能显示成统一的名字，就预先在这里登记好每位作者的信息。
#   文章开头写 author: 王志满律师（用冒号左边那个"钥匙"），
#   页面就会自动来这里查名字和主页地址。
#
# 【运行效果】
#   文章标题下方会出现"作者 王志满"，点名字能跳到他的个人主页。
#
# 【怎么改】
#   想加一位新作者，就照着下面 4 行的格式再写一段，
#   注意缩进必须用"两个空格"，不能用 Tab 键，否则网站会报错。
# ============================================================

# 冒号左边的"王志满律师"是给文章引用的钥匙（key），
# 文章里写 author: 王志满律师 就会匹配到这一段。
王志满律师:
  # 网页上实际显示出来的作者名（可以写得更好看，比如带职称）。
  # 【可DIY修改】改成"王志满 律师"等，网页上就显示这个名字。
  name: 王志满

  # 作者的 GitHub 用户名。主题会在作者名旁边显示一个小 GitHub 图标。
  # 【可DIY修改】留空或删掉这一行，就不显示 GitHub 图标。
  github: wangzhiman123

  # 点击作者名要跳转到的网址。
  # 【可DIY修改】改成你想跳转的页面地址，比如个人主页、律所官网。
  url: https://2019527.xyz/about/
