# ============================================================================
# links.yml —— 「友情链接」数据源 + 读者自助申请配置（全站唯一）
# ----------------------------------------------------------------------------
# 本文件由 tools\友链管理.html 生成，也可手工编辑，两种方式等效。
#
# 友链字段：name/url 必填；description/logo/email/rss 选填；
#           order 为排序权重（数字小的靠前）；active: false 表示暂时隐藏。
#   logo 留空 = 前台自动生成彩色首字图标（推荐，不依赖外部图片）。
#
# ⚠️ 下面 links 列表里只会出现「审核通过」的链接。
#   待审核与已拒绝的申请记录保存在管理台内，请用「导出申请存档」
#   单独存为 JSON —— 它们本来就不该出现在前台。
# ============================================================================

enabled: true
title: 友情链接
subtitle: 与优秀的站点互相学习、彼此引流
desc: >-
  欢迎交换友情链接：只收录稳定更新、内容原创、无恶意广告的站点。
  页面会同时展示本站维护的友链，以及另一些站同同步过来的朋友们。
new_tab: true
layout: card
max: 0
search: true
show_apply: true

# ---------- 读者自助申请区 ----------
# mode: form = 表单模式（读者填表，提交后自动发邮件）
#       comment = 评论模式（读者在评论区按模板留言）
#       none = 关闭申请区
apply:
  enabled: true
  # mode: form（表单提交）/ comment（评论区留言）/ none（关闭申请区）
  mode: comment
  email: "1320233415@qq.com"
  intro: >-
    欢迎与本站交换友情链接。请按下方「推荐格式示例」在本页评论区留言，审核通过后将展示在友链列表中。
  note: >-
    本站仅收录内容健康、已备案、访问正常的站点；纯广告、采集站、跳转页一律不予通过。审核一般 1–3 天，结果会回复到您填写的邮箱。
  # 收录偏好，显示在「友链格式」卡片里
  prefer: 优先原创内容、长期更新、风格稳定的博客或小众站点
  # 本站的友链申请页地址（读者填写"能看到申请的地址"时用）
  anchor_url: "https://2019527.xyz/links/"
  # 「前往评论区」按钮的跳转锚点。
  # 必须与评论区容器的 id 一致 —— 本项目 Giscus 组件用的是 #giscus-comments。
  # 【⚠️ 换评论系统时必须同步改这里】对应关系：
  #   Artalk  → #artalk-comments
  #   giscus  → #giscus-comments
  #   Twikoo  → #twikoo-comments
  #   Waline   → #waline-comments
  # 不改的后果：按钮点了会跳到页面顶部（读者以为没反应）。
  comment_anchor: "#giscus-comments"

