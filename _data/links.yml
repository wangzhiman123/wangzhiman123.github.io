# ============================================================================
# links.yml —— 「友情链接」数据源 + 读者自助申请配置（全站唯一）
# ----------------------------------------------------------------------------
# 本文件由 tools\友链管理.html 生成，也可手工编辑，两种方式等效。
#
# 友链字段：name/url 必填；description/logo/email/rss 选填；
#           order 为排序权重（数字小的靠前）；active: false 表示暂时隐藏。
#   logo 留空 = 前台自动生成彩色首字图标（推荐，不依赖外部图片）。
#
# ⚠️ 下面 links 列表里只会出现「审核通过」的链接。
#   待审核与已拒绝的申请记录保存在管理台内，请用「导出申请存档」
#   单独存为 JSON —— 它们本来就不该出现在前台。
# ============================================================================

enabled: true
title: 友情链接
subtitle: 与优秀的站点互相学习、彼此引流
new_tab: true
layout: card
max: 0
show_apply: true

# ---------- 读者自助申请区 ----------
# mode: form = 表单模式（读者填表，提交后自动发邮件）
#       comment = 评论模式（读者在评论区按模板留言）
#       none = 关闭申请区
apply:
  enabled: true
  mode: form
  email: "1320233415@qq.com"
  intro: >-
    欢迎与本站交换友情链接。请填写下方申请表单，审核通过后将展示在友链列表中。
  note: >-
    本站仅收录内容健康、已备案、访问正常的站点；纯广告、采集站、跳转页一律不予通过。审核一般 1–3 天，结果会回复到您填写的邮箱。
  comment_anchor: "#artalk-comments"

