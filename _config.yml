# ============================================================================
# 本文件是什么？
# ----------------------------------------------------------------------------
# 这是整个博客网站的「总配置清单」，相当于一台机器的总控制台。
# 网站的名字叫什么、网址是什么、作者是谁、用什么主题、开不开评论、
# 首页每页显示几篇文章……统统在这里设置。
#
# 【重要】这个文件是 YAML 格式，书写规则只有两条：
#   1. 用「冒号 + 一个空格」来赋值，例如：  title: 王志满律师
#   2. 靠「缩进（行首的空格数）」表示从属关系，缩进必须用空格、不能用 Tab。
# 改完保存后，网站重新构建一次就会生效。
#
# 带 # 号的行是注释（说明文字），不会被程序读取，写什么都行、删掉也不影响。
# 整个文件的执行流程：Jekyll（网站生成程序）启动时读取本文件 →
# 把这里的值填进网页模板 → 生成最终的 HTML 网页。
# ============================================================================


# ---------------------------- 一、主题与语言 ----------------------------
# 这一段决定「用哪套皮肤」和「网页用什么语言显示」。

# 指定使用的主题（皮肤）。主题就是别人做好的整套网页外观，
# 我们只是站在它的基础上改内容。
theme: jekyll-theme-chirpy

# 网站的界面语言。zh-CN 表示「中文-中国大陆」。
# 【可DIY修改】改成 en 会变成英文界面；改成 zh-TW 会变成繁体中文。
# 原理：程序会去找 _data/locales 文件夹里同名文件来翻译按钮文字，
# 找不到就退回用英文（en）。
lang: zh-CN

# 网站所在的时区。Asia/Shanghai 表示北京时间。
# 【可DIY修改】这个值影响文章「发布日期」按哪个时区计算。
# 如果人在国外，可以改成对应的时区名（参考 https://zones.arilyn.cc）。
timezone: Asia/Shanghai


# ------------------- 二、SEO 设置（让搜索引擎认识你） -------------------
# SEO = 搜索引擎优化。简单说，就是「让百度、谷歌更清楚地知道你的网站是干什么的，
# 从而在别人搜索时把你的网站排在前面」。下面这些内容会出现在搜索结果的标题和摘要里。

# 网站标题。会显示在浏览器标签页、搜索结果标题、网站左上角。
# 【可DIY修改】改成您想显示的名字即可。
title: 王志满律师

# 网站副标题（一句话口号）。显示在网站标题下方或首页的描述位置。
# 【可DIY修改】改成正对味的宣传语。
tagline: 专注民商事纠纷与企业法律顾问

# 网站描述。主要给搜索引擎和 RSS 订阅用。
# 【可DIY修改】建议 60～160 个字，说清楚网站是干什么的。
# 注意：下面这种「>-」的写法表示「把后面缩进的多行文字合并成一行」，
# 也就是换行写也没关系，程序会自动拼成一整句。文字要缩进两个空格。
description: >- # used by seo meta and the atom feed
  王志满律师个人网站，专注合同纠纷与公司法实务，分享法律专业文章

# 网站的正式网址（必须带 https://，结尾不要加斜杠 /）。
# 【重要】这个值必须和您真实的域名一致，否则网站里的图片、样式表可能加载不出来。
# 【可DIY修改】换域名时，这一行一定要同步改。
url: "https://2019527.xyz"

# 您的 GitHub 用户名。
# 作用：文章页上会自动生成「在 GitHub 上查看/编辑」之类的链接。
github:
  username: wangzhiman123

# 您的 Twitter（推特）用户名。留空表示不使用。
# 【可DIY修改】如果要填，只填用户名，不要加 @ 符号。
# twitter:
#  username:   # change to your Twitter username

# 作者（也就是您本人）的公开联系信息。
# 这些信息会用在两处：文章默认作者名、网页最下方「版权归 XX 所有」。
social:
  # 显示的作者名。会作为文章默认作者和页脚版权人。
  # 【可DIY修改】改成本名或笔名。
  name: 王志满
  # 公开邮箱。会显示在网站的联系方式区域，注意这属于公开信息。
  # 【可DIY修改】换成您的邮箱；不想公开就清空（写成 email: ）。
  email: 1320233415@qq.com # change to your email address
  # 「联邦宇宙」账号（一种去中心化社交网络，国内基本用不上），留空即可。
  fediverse_handle: # fill in your fediverse handle. E.g. "@username@domain.com"

  # 社交链接列表（一个短横线就是一个链接）。
  # 【特殊规则】列表里的「第一个」链接，会成为版权人名字点击后跳转的地址。
  links:
    # 第一条：点作者名「王志满」后跳转的页面
    - https://2019527.xyz/about/ # 作者名"王志满"点击后跳转的地址
    # 第二条：GitHub 主页
    - https://github.com/wangzhiman123 # change to your GitHub homepage
    # 【可DIY修改】想加更多链接，把下面几行前面的 # 删掉，换成自己的地址即可（格式保持一致）
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 站长验证设置：在各搜索引擎的「站长平台」注册网站时，对方会给你一串验证码，
# 填在这里，对方就能确认「这个网站确实是你自己的」，然后才给你开放统计数据等功能。
# 【可DIY修改】用哪个平台就填哪个，不用的留空。
webmaster_verifications:
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: codeva-EmbmsgvSk4 # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings
# （以上是 SEO 设置段落，到此结束）


# --------------------------- 三、网站流量统计 ---------------------------
# 这一整段决定「用哪家的统计工具来记录有多少人访问了网站」。
# 【重点理解】这里的统计工具只负责「后台看报表」，跟页面上显示的那个
# 「浏览量数字」不完全是一回事，具体见下面的注释。
analytics:
  # 谷歌分析，留空表示不用。
  google:
    id: # fill in your Google Analytics ID

  # GoatCounter 统计。这里故意填了 "busuanzi"（不蒜子，一个国内免费的统计服务名）。
  # 【为什么要这么做？】主题原本支持 GoatCounter 统计，但作者不想用全套 GoatCounter，
  # 只想借用它「填充页面浏览量数字」的功能，所以这里保留了一个非空的假 id，
  # 让主题以为「统计功能是开着的，该去调用浏览量组件了」，但实际对应的文件
  # _includes/analytics/goatcounter.html 已经被清空，因此不会真的去连 GoatCounter 服务器。
  # 【结论】这一行不要改，改了会影响浏览量的显示逻辑。
  goatcounter:
    id: busuanzi

  # Umami 统计（另一种自建统计工具），留空表示不用。
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain

  # Matomo 统计，留空表示不用。
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain

  # Cloudflare 网站统计的账号 id。
  # 【可DIY修改】如果您不用 Cloudflare，可以清空（写成 id: ）。
  cloudflare:
    id: # e08d28ff568f4c1fa22f7f56ed3df1e3

  # 百度统计（Baidu Tongji）—— 站点流量分析，仅用于后台看报表，不参与页面上"浏览量数字"的显示。
  # id 非空时，Chirpy 会自动在 <head> 中加载 _includes/analytics/baidu.html。
  # 留空（写成 id: ）即可整段停用，无需删任何文件。
  # 【可DIY修改】换成您在百度统计后台申请到的 id 即可；想彻底关掉，把引号里清空。
  baidu:
    id: "be5a9b478abeb230cf93787a0539da2f"

  # Fathom 统计，留空表示不用。
  fathom:
    id: # fill in your Fathom Site ID

# 页面浏览量的「数据来源」设置。
# 目前主题只支持 goatcounter 这一种，保持不动。
# 注意：真正显示在文章卡片和文章页上的浏览量数字，来自 _data/views.json 文件，
# 那个文件是由 scripts/update_views.py 脚本定时抓取后生成的。
pageviews:
  provider: goatcounter # now only supports 'goatcounter'

# ============================================================================
# 【浏览量显示方案 · 可插拔开关】viewcount.provider
# ----------------------------------------------------------------------------
# 这是"浏览量怎么显示"的总闸门，改这一个值就能整体切换方案，无需改任何模板。
#
#   取值           方案                     显示方式
#   ------------   ----------------------   ------------------------------------
#   static        沿用现有方案（默认）      读取 _data/views.json，构建时静态印在
#                                          页面里；打开即可见、不转圈、无请求
#   busuanzi      替换为不蒜子官方方案      由不蒜子官方 mini.js 在访客浏览器里
#                                          实时拉取并填充（数字有约 1 秒延迟）
#
# 【怎么切回去（回滚）】
#   把下面 provider 的值从 busuanzi 改回 static，重新部署即可，无需改任何模板。
# 【怎么彻底停用浏览量】
#   把 provider 的值清空（写成 provider:），所有浏览量相关元素都不再渲染。
#
# 【重要】无论选哪种，_data/views.json 这条"数据管线"都会继续运行，
#   因为侧边栏「热门文章」排序必须依赖它（前端拿不到全站浏览量）。
#   也就是说：本开关只切换"页面上怎么显示"，不影响数据抓取。
#   详见《浏览量方案切换与回滚说明.md》。
# ============================================================================
viewcount:
  provider: static # [ static | busuanzi ]（留空 = 全站停用浏览量显示）

# --------------------------- 四、外观与显示 ---------------------------

# 网站默认配色模式。
# 【重要说明】留空 = 跟随访客电脑/手机的系统设置（系统是深色它就深色）。
# 只要留空，网页左下角就会出现一个「太阳/月亮」小按钮，访客能自己切换深浅色。
# 【可DIY修改】填 light = 永远浅色（白底黑字）；填 dark = 永远深色（黑底白字）。
theme_mode: # [light | dark]

# CDN（内容分发网络）地址。CDN 可以理解为「把图片、视频等大文件放到全球各地的缓存服务器上，
# 让访客就近下载，从而打开更快」。留空表示不用 CDN。
# 【可DIY修改】如果图片加载慢，可以填入 CDN 服务商给的域名，例如 https://cdn.com
# 注意：一旦填了，网站里所有以 / 开头的图片/音视频地址都会自动加上这个前缀。
cdn:

# 侧边栏头像图片的路径。
# 【可DIY修改】想换头像，就把您的图片放到 assets/ 目录下，然后把这里改成新文件名，
# 例如 avatar: /assets/my-photo.jpg
avatar: /assets/avatar.jpg

# 分享到社交平台时显示的预览大图（别人在微信/QQ 里发链接时，链接下面出现的缩略图）。
# 留空表示不用；也可以在具体某篇文章的开头单独指定该文章自己的预览图。
social_preview_image: /assets/img/og/og-default.jpg # string, local or CORS resources

# 文章目录（TOC，Table Of Contents）的总开关。
# true = 文章页面右侧自动生成「本文目录」，点一下能跳到对应段落。
# 【可DIY修改】改成 false 就全部文章都不显示目录。
toc: true

# --------------------------- 五、文章页操作按钮 ---------------------------
actions:
  # 「编辑这篇文章」按钮。一般用于多人协作的网站，个人博客通常用不上。
  edit_post:
    enabled: false # set to true to display the "Edit this post" action.
    url: "" # repository base URL, e.g. https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # Use dynamic or static URL for the edit link.
    # If `static_url` is false, the post's path will be appended to the `url` above as the final edit link.
    # Set to true if the URL should remain unchanged, which means each post will share the same edit link.
    static_url: false # [ true | false ]

# ----------------------------- 六、评论系统 -----------------------------
# 这一段决定「读者能不能在文章下面留言、用哪家评论服务」。
comments:
  # ==========================================================================
  # 【全站评论系统总开关】这一行决定用哪家评论服务，改这一个值即可全站切换。
  #
  #   当前启用：giscus（评论数据存在 GitHub Discussions）
  #
  # 【为什么选它】
  #   ① 零服务器、零数据库、零成本：不需要买服务器、不需要备案、不需要运维，
  #      评论数据在你自己的 GitHub 仓库里，随时可导出、可备份、可迁移。
  #   ② 不碰任何被墙的域名：Disqus、Hyvor 在大陆打不开，giscus 只用 GitHub
  #      一个域名，不存在多点被墙的问题。
  #   ③ 天然具备需求 3 的全部能力：GitHub Discussions 本身就支持
  #      嵌套回复（无限层级）、点赞表情、评论计数，
  #      以及后台管理（删除、屏蔽、锁定讨论区、管理员审核都在 GitHub 界面完成）。
  #   ④ 安全性由 GitHub 兜底：评论渲染在 GitHub 的跨域 iframe 沙箱里，
  #      XSS 攻击碰不到你的博客页面。
  #
  # 【必须知道的两个代价】（请务必了解，避免上线后才发现）
  #   ⚠️ 读者必须登录 GitHub 账号才能留言。
  #      这意味着：懂技术的读者很乐意，**普通访客可能直接放弃**。
  #      法律行业的读者群体里有相当比例不使用 GitHub，
  #      所以站点内必须同时保留邮件联系入口（本项目已在评论区降级提示里放了）。
  #   ⚠️ 评论内容无法被搜索引擎抓取。
  #      Giscus 界面在跨域 iframe 里，静态网页产物中不含评论正文，
  #      搜索引擎只能看到评论区容器。本组件已尽力做了语义标签与
  #      结构化数据（见 _includes/comments/giscus.html 文末「SEO 说明」）。
  #      若将来评论正文收录确有需要，可另加「构建期快照」方案。
  #
  # 【⚠️ 三个前提，缺一个评论区都不出来】
  #   ① 仓库必须是【公开】的，否则访客看不到讨论区
  #   ② 仓库要开启 Discussions：Settings → General → Features → Discussions
  #   ③ 仓库要安装 giscus app：https://github.com/apps/giscus
  # 装好后打开 https://giscus.app/ 按提示一步步填，
  # 页面底部会直接生成配置代码，把里面的值抄到下面 giscus 段即可。
  #
  # 【giscus.app 是配置生成器，不是运行依赖】
  #   网站运行时只请求 giscus.app/client.js 与 giscus 的 iframe，
  #   不会请求 giscus.app 以外的配置接口。
  #
  # 【想换成自托管评论（Artalk）时怎么办】
  #   ① 把 provider 改成 artalk，填好下面 artalk.server
  #      （服务器上执行 deploy/05-install-artalk.sh 一键部署）
  #   ② 把 _data/links.yml 的 apply.comment_anchor 改成 "#artalk-comments"
  #   ③ 组件代码 _includes/comments/artalk.html 已经在仓库里，不用重新写
  provider: artalk # giscus
  # 以下各家评论服务，只有 provider 里指定的那一家会生效，其余留空即可。

  # Disqus 评论（国外服务，国内被墙），不用就留空。
  disqus:
    shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname

  # utterances 评论（基于 GitHub Issues），不用就留空。
  utterances:
    repo: # wangzhiman123/wangzhiman123.github.io
    issue_term: # < url | pathname | title | ...>
  # 配置保留是为了随时可切回，代码组件 _includes/comments/giscus.html 也还在。
  giscus:
    # 仓库（用户名/仓库名）
    repo: wangzhiman123/wangzhiman123.github.io
    # 仓库 ID（在 giscus.app 上填完仓库后自动给出）
    repo_id: R_kgDOUx9AFg
    # 讨论区类别名。建议用 Announcements 类型，这样只有你和 giscus 能新建讨论。
    category: Announcements
    # 讨论区类别 ID（同上，从 giscus.app 拿）
    category_id: DIC_kwDOUx9AFs4DGqrB
    # 页面与讨论的映射方式：pathname（用网址）/ url / title / og:title / specific
    #【可DIY修改】建议保持 pathname。改了会导致历史评论对不上，不建议。
    mapping: pathname
    # 严格匹配：0 = 模糊匹配（默认）/ 1 = 严格匹配
    # 【可DIY修改】如果你有很多路径相似的页面，改成 1 更不容易串评论。
    strict: 0
    # 输入框位置：bottom（评论列表下方，默认）/ top（评论列表上方）
    # 【可DIY修改】你的文章普遍较长，建议改成 top ——
    #   读者滚到底部就能直接开写，不用再往下翻一屏。
    input_position: top
    # 界面语言
    lang: zh-CN
    # 是否显示表情反应（👍❤️等）：1 = 开/ 0 = 关
    reactions_enabled: 1
    # 加载超时（毫秒，可选）。到点仍未就绪就显示友好提示 + 邮件联系入口，
    # 而不是让读者面对一片空白的评论区。
    # 【可DIY修改】网络较慢可以调大，例如 20000。
    timeout: 15000
    # 加载失败/未就绪时，降级提示里显示的联系方式。留空则自动取
    # _config.yml 里的 social.email。
    contact_email:
    # 评论区标题（显示在评论区顶部）。
    # 【可DIY修改】改成「留言讨论」「评论」等都行；留空则不显示标题。
    title: 评论与交流
    # 是否显示「N 条评论」徽章：1 = 开 / 0 = 关。
    # 说明：giscus 的界面在跨域 iframe 里，宿主页读不到里面的评论数，
    #   所以徽章的数字是单独查一次 GitHub 接口得到的（读者滚动到评论区时才查，
    #   同一会话内只查一次）。查不到就自动隐藏，绝不影响读者留言。
    # ⚠️ 未登录状态下 GitHub 接口限 60 次/小时/IP。个人博客通常远低于此量，
    #   若你担心被限流，可以直接设成 0（关闭后完全不发起这个请求）。
    show_count: 1

  # Artalk 评论（自托管，当前未启用 —— 需要时把上面 provider 改成 artalk 即可）。
  # 自托管 = 评论服务是跑在你自己服务器上的一个程序，数据存在你自己的磁盘上。
  # 相比 giscus 的优势：读者可用昵称匿名留言（无需 GitHub 账号）、数据完全自主、
  #   国内访问速度与本站一致。
  # 代价：需要一台已备案的服务器（你已有），
  #   在服务器上执行 deploy/05-install-artalk.sh 即可一键部署。
  # 官方文档：https://artalk.js.org/
  artalk:
    # ⚠️ 必填：Artalk 服务端（后端 API）地址。要求公网可访问、使用 https、结尾不带"/"。
    #    留空 = 评论功能整体关闭：页面不会渲染评论容器，也不会报错（站点照常构建），
    #    友链申请区会自动降级为「改为邮件提交」，不留点不动的死按钮。
    #    例：https://comment.2019527.xyz
    # 【可DIY修改】部署好之后，把服务地址填在这一行，评论功能即刻生效，无需改任何代码。
    server: https://artalk.2019527.xyz
    # 站点名称，用于 Artalk 多站点隔离（对应后台「站点管理」里的名称）。
    # 同一个 Artalk 服务端可以给多个网站用，靠这个名称区分数据，别填错。
    # ⚠️ 一旦有了评论数据，这个值就不能再改——改了等于换了一个新站点，历史评论会"消失"。
    site: 王志满律师
    # 前端静态资源地址（可选）：留空时自动取「server + /dist」。
    #    【强烈建议留空】这样 JS/CSS 从你自己的域名加载，完全不依赖任何境外 CDN。
    assets_url:
    # 界面语言：auto（跟随浏览器）/ zh-CN / en
    locale: zh-CN

    # ---------- 以下是体验与性能相关项，均有合理默认值，不懂就别改 ----------
    # 加载超时（毫秒）：到点仍未就绪就显示友好提示 + 邮件入口，绝不留空白。
    timeout: 15000
    # 头像来源镜像。Artalk 默认用 Gravatar（www.gravatar.com），该域名在大陆访问
    # 很不稳定，读者头像会大面积裂图。下面已默认改成国内可访问的镜像。
    gravatar_mirror: https://cravatar.cn/avatar/
    # 允许嵌套回复的最大层级：2 = 主评论 + 两层回复。
    # 【可DIY修改】改成 3 可以更深，但超过 3 层手机上会挤成一条，建议不超过 3。
    nest_max: 2
    # 嵌套回复的排序：DATE_ASC（按时间正序，像论坛，从上往下读）
    #   DATE_DESC（按时间倒序，最新回复在最上）。下面默认正序，更符合论坛阅读习惯。
    nest_sort: DATE_ASC
    # 每页拉取的评论条数（性能相关，见部署文档「加载性能」一节）。
    page_size: 20
    # 是否显示读者的浏览器（UA）徽章。律师站的读者是普通访客，建议关掉，
    # 少收集一点浏览器指纹信息，也显得更干净。
    ua_badge: false
    # 是否开启图片上传。开启后读者可直接贴图（文件存 Artalk 服务器）。
    # 【可DIY修改】法律专业内容站，为免被贴广告图，建议保持 false。

# --------------------- 七、静态资源自托管（进阶，可选） ---------------------
# 主题默认从公共 CDN（比如 jsdelivr）下载字体、图标等资源。
# 开启「自托管」后，改为从自己网站的目录里加载，好处是：不依赖国外 CDN、
# 国内访问更稳定、页面打开更快。
# 自托管的具体说明见「自托管静态资源（可选）-操作说明.md」。
assets:
  self_host:
    enabled: true # 保持为空表示 false
    # specify the Jekyll environment, empty means both
    # only works if `assets.self_host.enabled` is 'true'
    env: # [development | production]

# --------------------------- 八、PWA（可安装应用） ---------------------------
# PWA = Progressive Web App，渐进式网页应用。开启后，访客可以用手机浏览器
# 「添加到主屏幕」，像装了个 App 一样打开网站；还能在断网时显示缓存内容。
pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # PWA离线缓存开关， 改 false：发完文章访客立刻看到最新版，但离线则无法访问
    # Paths defined here will be excluded from the PWA cache.
    # Usually its value is the `baseurl` of another website that
    # shares the same domain name as the current website.
    # 【可DIY修改】想让某些路径不进缓存，把下面那行前面的 # 去掉并改成要排除的路径。
    deny_paths:
      # - "/example"  # URLs match `<SITE_URL>/example/*` will not be cached by the PWA

# 首页「每页显示多少篇文章」（翻页数量）。
# 【可DIY修改】数字改大，一页显示的文章更多、页面更长；改小，翻页更频繁。
paginate: 10

# 网站的子路径。留空表示网站就放在域名根目录（https://2019527.xyz/）。
# 【重要】除非您的网站要放在类似 /blog/ 这样的子目录下，否则不要改。
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------
# （以下参数属于主题内部机制，官方建议不要改动，除非您很清楚自己在做什么）


# -------------------- 九、正文排版引擎 Kramdown 设置 --------------------
# 网站文章是 Markdown 格式（一种用符号排版文字的简易写法），
# Kramdown 就是「把 Markdown 翻译成网页」的翻译官。
kramdown:
  # 脚注（页面底部的补充说明）后面那个「返回」小箭头的图标样式。
  footnote_backlink: "&#8617;&#xfe0e;"
  # 代码高亮引擎。rouge 会把代码块里的关键字染上颜色，让代码更好看。
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    # 高亮区域的 CSS 类名，主题样式靠它来上色，不要改。
    css_class: highlight
    # default_lang: console
    span:
      # 行内代码（用反引号包起来的）是否显示行号，false = 不显示。
      line_numbers: false
    block:
      # 整块代码是否显示行号，true = 显示。
      # 【可DIY修改】改成 false 可以让代码块不再显示左侧行号。
      line_numbers: true
      # 行号从第几行开始数。
      start_line: 1

# ---------------------------- 十、文章集设置 ----------------------------
# collections 用来定义「一类特殊的页面」。这里定义了侧边栏的标签页。
collections:
  tabs:
    # true = 这些页面要真正生成 HTML 文件（必须为 true）。
    output: true
    # 按页面开头 order 字段的数字大小排序，数字小的排前面。
    sort_by: order

# defaults：批量为某类文件设置统一的默认值，省得每篇文章都重复写。
defaults:
  # 【第 1 条】针对「文章」（_posts 目录下的文件）
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      # 默认套用 post 这个页面模板（也就是 _layouts/post.html）。
      layout: post
      # 默认开启评论。
      comments: true # Enable comments in posts.
      # 默认显示目录。
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      # 【重要】文章的网址格式。:title 表示用文件名里的标题部分作为网址。
      # 例如文件 2026-09-29-post-001.md 的网址就是 /posts/post-001/。
      # 擅自修改会导致站内已存在的文章链接、浏览量统计全部对不上，务必慎重！
      permalink: /posts/:title/

  # 【第 2 条】针对「草稿」（_drafts 目录下的文件）。
  - scope:
      path: _drafts
    values:
      # 草稿页不显示评论区。
      comments: false

  # 【第 3 条】针对侧边栏标签页（上面 collections 里定义的 tabs）。
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      # 套用 page 模板。
      layout: page
      # 标签页的网址格式，例如「关于」页就是 /about/。
      permalink: /:title/

# ---------------------------- 十一、样式编译 ----------------------------
sass:
  # 把网页样式文件（SCSS）压缩成最小体积，让页面加载更快。
  # 【可DIY修改】改成 expanded 会保留换行和缩进、方便调试，但文件更大（正式网站不建议）。
  style: compressed

# ---------------------------- 十二、HTML 压缩 ----------------------------
# 构建时把生成的网页「瘦身」：删掉多余的空行、注释、闭合标签，减小体积、加快打开速度。
# 【重要副作用】压缩时会把代码里的换行符也删掉，所以网页里内联的 JavaScript 代码
# 绝对不能用「//」写单行注释（换行没了，后面的代码会被一起注释掉导致报错），
# 必须用 /* 星号斜杠 */ 这种块注释。本项目的 _includes/pageviews/goatcounter.html
# 就是按这个规则写的。
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    # 在「开发模式」下不压缩，方便本机调试时看清代码。
    envs: [development]

# ------------------------ 十三、构建时排除的文件 ------------------------
# 下面这些文件只存在于您的电脑/仓库里，不会被打包发布到网站上。
# 好处：别人访问不到部署脚本，也减少网站体积。
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - scripts
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  # 部署脚本（不需要发布到网站上）
  - deploy.ps1
  - deploy.bat
  - DEPLOY.md
  # 阿里云 ECS 自主部署工具（见 deploy/README.md，仅服务器使用）
  - deploy

# ------------------------- 十四、分类与标签归档 -------------------------
# 让网站自动为每个「分类」和「标签」生成一个汇总页面，
# 列出属于该分类/标签的所有文章。
jekyll-archives:
  # enabled 表示要为哪几类生成归档页，这里同时开启了分类和标签。
  enabled: [categories, tags]
  layouts:
    # 分类归档页用 category 模板，标签归档页用 tag 模板。
    category: category
    tag: tag
  permalinks:
    # 【可DIY修改】归档页的网址格式。改了以后，搜索引擎里已收录的旧链接会失效。
    tag: /tags/:name/
    category: /categories/:name/

# =========================== 十五、友情链接板块 ===========================
# 【本段是什么】
#   「友情链接」板块的开关与样式微调入口。
#
# 【重要：大部分配置不在这里】
#   友链列表、以及板块自身的配置（标题/是否新窗口打开/卡片或列表式等）
#   全部放在 _data/links.yml —— 因为 Jekyll 的 _data 文件天然支持
#   多层结构，比在 _config.yml 里堆一大段列表更好维护、更好注释。
#
#   日常增删友链：改 _data/links.yml（或打开 tools\友链管理.html 可视化操作）
#   板块配置：   也在 _data/links.yml 顶部的配置段
#
# 【下面这个开关的作用】
#   设为 true 时，即使 _data/links.yml 里的 enabled 为 false 也仍然显示；
#   保持 false（推荐）= 完全以 links.yml 里的 enabled 为准，单一数据源。
#
# 【板块显示在哪些位置】
#   ① /links/ 顶部导航独立页（_tabs/links.md）
#   ② 「关于」页底部（_tabs/about.md 末尾调用）
#   ③ 首页/文章页右侧边栏小面板（_layouts/home.html 的 panel_includes）
#   三处共用一份数据，内容永远一致。详见《友链板块使用说明.md》。
# ==========================================================================
friend_links:
  # 【可DIY修改】留空或 false = 以 _data/links.yml 里的 enabled 为准（推荐）
  enabled:
