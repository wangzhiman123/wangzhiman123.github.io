# ============================================================
# 定时抓取文章浏览量 -> 写入 _data/views.json
# ------------------------------------------------------------
# 首页卡片的浏览量在「构建时」从这个 json 静态渲染，
# 因此卡片不发起任何前端请求，永远不会加载失败。
#
# 配套文件：scripts/update_views.py（必须与本文件一起上传）
#
# 运行方式：
#   1) 上传 scripts/update_views.py 和本文件到仓库对应目录
#   2) 首次请手动运行一次生成数据：
#      Actions -> Update Post Views -> Run workflow
#   3) 之后每周一自动更新一次
#
# 注意：仓库 Settings -> Actions -> Workflow permissions
#       需为 Read and write，否则提交环节会 403
# ============================================================

name: Update Post Views

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch page views from Busuanzi
        env:
          SITE_URL: https://2019527.xyz
        run: python3 scripts/update_views.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/views.json
          if git diff --cached --quiet; then
            echo "浏览量无变化，跳过提交"
          else
            git commit -m "chore(data): update post views"
            git push
          fi
