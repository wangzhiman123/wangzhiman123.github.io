# ============================================================
# 【本文件是什么？】
# 抓取文章浏览量 -> 写入 _data/views.json
# ------------------------------------------------------------
# 一句话概括：这是另一位"云端机器人"的排班表——它负责定期去统计服务
# 把每篇文章的浏览量问回来，更新数据文件。
# 它跟 pages-deploy.yml 是一对搭档：
#   本文件负责"取数字"（更新数据文件），
#   pages-deploy.yml 负责"把数字印到网页上"（重新编译发布）。
#
# 首页卡片和文章页都读这一份数据（构建时静态渲染），
# 因此两处的浏览量永远一致，也不会出现加载失败/转圈等异常。
#
# 配套文件：scripts/update_views.py（必须与本文件一起上传）
#   —— 真正干活的脚本是那个 Python 文件，本文件只是"什么时候去喊它干活"。
#
# 运行时机：
#   1) 每 6 小时自动刷新一次（北京时间 03:00 / 09:00 / 15:00 / 21:00）
#   2) 手动：Actions -> Update Post Views -> Run workflow
#   3) 文章有增删改时自动刷新（push 到 main 分支的 _posts/ 目录）
#
# 提示：GitHub 的定时任务在高峰期可能有几分钟延迟，属正常现象。
#       若嫌刷新太频繁，把下面的 cron 改回 '0 19 * * *'（每天 03:00 一次）即可。
#
# 注意 1：本文件用 GITHUB_TOKEN 提交，而 GITHUB_TOKEN 的提交不会触发其它 workflow。
#         线上页面由 pages-deploy.yml 的定时任务（每 6 小时）重建后才会显示新数值。
#   —— 这句话很重要，解释了一个容易困惑的现象：
#      本任务更新了数据文件，但网页上的数字不会"立刻"变，
#      要等 pages-deploy.yml 那次重建跑完，才会真正显示出来。
#      两次任务的时间差就是"数字延迟显现"的原因，属于正常设计，不是故障。
#
# 注意 2：仓库 Settings -> Actions -> General -> Workflow permissions
#         需为 Read and write，否则提交环节会 403
#   —— 403 是"没权限"的意思。这里因为要把更新后的数据文件提交回仓库，
#      所以必须给机器人"写"的权限，只读是不够的。
#      这也是新手最常踩的坑之一，配置新仓库时记得检查这一项。
# ============================================================

name: Update Post Views
# 这个自动化流程的名字，会显示在 GitHub 的 Actions 页面上。

# ---------------------- 什么时候自动运行 ----------------------
on:
  schedule:
    # 定时运行。
    # 每 6 小时一次。cron 用 UTC，北京时间 = UTC + 8：
    #   01:00 UTC -> 09:00 北京
    #   07:00 UTC -> 15:00 北京
    #   13:00 UTC -> 21:00 北京
    #   19:00 UTC -> 次日 03:00 北京
    #   改回代码为：'0 1,7,13,19 * * *'
    - cron: '0 19 * * *'
    # 当前实际设置：UTC 19:00，也就是北京时间次日 03:00，每天 1 次。
    # 【可DIY修改】想改回每天 4 次，把上面那行换成 '0 1,7,13,19 * * *'。
    # ⚠️ 注意：改完这里，最好确认一下 pages-deploy.yml 里的重建时间也与之配合，
    #    否则可能出现"数据更新了但迟迟没印到网页上"的情况。
    #    建议规则：重建时间比抓取时间晚半小时到一小时。

  workflow_dispatch:
    # 允许您手动点击运行（Actions 页面会出现「Run workflow」按钮）。
    # 刚发完文章想立刻看到浏览量？点一下这里即可，不用干等定时任务。

  push:
    # 有推送时也运行，但下面两个 paths 限定了"只有这几种改动才触发"。
    branches:
      - main
    paths:
      - '_posts/**'
      - 'scripts/update_views.py'
      # 只有两种情况触发：
      #   ① _posts/ 里的文章有增删改 —— 因为新增了文章需要给它建立浏览量记录；
      #   ② 抓取脚本本身被修改了。
      # 【为什么不做成"任何改动都触发"？】那样太频繁了，纯属浪费；
      # 只在真正相关时才跑，更省资源也更清爽。

# ---------------------- 权限声明 ----------------------
permissions:
  contents: write
  # 【关键】允许写仓库内容。因为这个任务要把更新后的数据文件提交回仓库。
  # 如果这里只给 read，提交那一步就会报错（也就是前面说的 403）。

# 避免两次运行并发写同一份数据
concurrency:
  group: update-views
  cancel-in-progress: false
  # 把本任务归到 update-views 这个队列，且新任务等旧任务跑完再跑。
  # 【为什么必须这样？】两个任务同时写同一个数据文件，
  # 很容易互相覆盖、算错账（还记得"查询次数"那本账吗，更不能并发）。
  # 排队执行虽然慢一点，但数据准确最重要。

# ---------------------- 任务内容 ----------------------
jobs:
  update:
    runs-on: ubuntu-latest
    # 在 GitHub 的 Ubuntu 云主机上运行。

    steps:
      - name: Checkout
        # 第 1 步：下载仓库代码（这里用浅克隆就够了）。
        uses: actions/checkout@v4
        # 【小知识】这里没有写 fetch-depth: 0，跟 pages-deploy.yml 不同。
        # 因为抓取浏览量只需要数据文件，不需要 Git 全历史。

      - name: Set up Python
        # 第 2 步：准备 Python 运行环境。
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 使用 Python 3.11 版本。
          # 【可DIY修改】一般不需要动。本项目的脚本用的都是通用功能，版本兼容性很好。

      - name: Fetch page views from Busuanzi
        # 第 3 步：真正执行抓取（把活交给那个 Python 脚本）。
        env:
          SITE_URL: https://2019527.xyz
          # 通过环境变量告诉脚本"网站地址是什么"，
          # 脚本里用 os.environ.get("SITE_URL", ...) 读取它。
          # 【好处】换域名时只要改这一行，不必去改 Python 代码。
        run: python3 scripts/update_views.py
        # 运行抓取脚本。跑完后 _data/views.json 和 _data/pv_state.json 就更新好了。

      - name: Commit and push
        # 第 4 步：把更新后的数据文件提交回仓库，这样才能被网页引用到。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先给机器人设置一个身份（提交记录里会显示这个人和邮箱）。
          # 当然不是真人，只是让 Git 知道"这次提交是谁做的"。

          git add _data/views.json _data/pv_state.json
          # 只把这两个数据文件加入"待提交"名单。
          # 【为什么只加这两个？】精确提交能避免误把别的临时文件也提交上去。

          if git diff --cached --quiet; then
            echo "浏览量无变化，跳过提交"
          else
            git commit -m "chore(data): update post views"
            git push || echo "推送失败（可能是 main 分支有保护规则），本次仅更新 workflow 日志，不标记为失败"
          fi
          # 这段逻辑读法：
          #   git diff --cached --quiet 是在问："这次要提交的内容，跟已有内容有区别吗？"
          #     → 没区别（quiet 模式没有输出），说明浏览量一个都没变，
          #       那就打印一句提示、跳过提交，不制造无意义的记录。
          #     → 有区别，就正常提交并推送。
          #   末尾的 || echo "..." 是"推送失败也不报错"的兜底：
          #   万一仓库设置了保护规则不允许机器人推送，也只是打印一句说明，
          #   不让整个任务标记为失败——因为数据其实已经抓到了，
          #   只是没提交成功，没必要亮红灯吓人。
