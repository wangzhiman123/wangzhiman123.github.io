# ============================================================
# 抓取文章浏览量 -> 写入 _data/views.json
# ------------------------------------------------------------
# 首页卡片和文章页都读这一份数据（构建时静态渲染），
# 因此两处的浏览量永远一致，也不会出现加载失败/转圈等异常。
#
# 配套文件：scripts/update_views.py（必须与本文件一起上传）
#
# 运行时机：
#   1) 每 6 小时自动刷新一次（北京时间 03:00 / 09:00 / 15:00 / 21:00）
#   2) 手动：Actions -> Update Post Views -> Run workflow
#   3) 文章有增删改时自动刷新（push 到 _posts/ 目录）
#
# 提示：GitHub 的定时任务在高峰期可能有几分钟延迟，属正常现象。
#       若嫌刷新太频繁，把下面的 cron 改回 '0 19 * * *'（每天 03:00 一次）即可。
#
# 注意：仓库 Settings -> Actions -> General -> Workflow permissions
#       需为 Read and write，否则提交环节会 403
# ============================================================

name: Update Post Views

on:
  schedule:
    # 每 6 小时一次。cron 用 UTC，北京时间 = UTC + 8：
    #   01:00 UTC -> 09:00 北京
    #   07:00 UTC -> 15:00 北京
    #   13:00 UTC -> 21:00 北京
    #   19:00 UTC -> 次日 03:00 北京
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - '_posts/**'
      - 'scripts/update_views.py'

permissions:
  contents: write

# 避免两次运行并发写同一份数据
concurrency:
  group: update-views
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch page views from Busuanzi
        env:
          SITE_URL: https://2019527.xyz
        run: python3 scripts/update_views.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/views.json _data/pv_state.json
          if git diff --cached --quiet; then
            echo "浏览量无变化，跳过提交"
          else
            git commit -m "chore(data): update post views"
            git push
          fi
