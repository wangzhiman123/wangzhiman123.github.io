name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Setup SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Secret「VPS_HOST」未配置或名字不对——请到 Settings → Secrets and variables → Actions 添加（值=服务器IP）"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Secret「VPS_SSH_KEY」未配置或名字不对"
            exit 1
          fi
          echo "检测通过：HOST=$HOST | KEY长度=${#KEY} 字符 | 首行=$(echo "$KEY" | head -1)"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan_err.txt; then
            echo "✅ SSH 连通性正常，known_hosts 已写入 $(wc -l < ~/.ssh/known_hosts) 行"
          else
            echo "::error::SSH 连接测试失败——请检查服务器安全组是否放行了 22 端口（TCP）"
            cat /tmp/keyscan_err.txt
            exit 1
          fi

      - name: Rsync to VPS
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" _site/ root@${{ secrets.VPS_HOST }}:/www/wwwroot/2019527.xyz/
