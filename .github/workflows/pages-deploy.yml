name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # 每 6 小时重建一次：让「Update Post Views」写入的 _data/views.json 能落到线上。
  # 该工作流在 UTC 01:00 / 07:00 / 13:00 / 19:00 运行，这里延后 30 分钟重建（cron 用 UTC）。
  schedule:
    - cron: '30 1,7,13,19 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # upload-artifact（自有服务器产物）需要写权限，缺失会导致 403 并使 build job 失败
  actions: write

# Allow one concurrent deployment
# 不取消进行中的运行，保证最后一次提交一定被部署上线
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # 链接检查只告警、不阻断发布：网页端写作时偶发的坏链/缺图不应导致整站无法上线
      - name: Test site
        continue-on-error: true
        run: |
          bundle exec htmlproofer "_site${{ steps.pages.outputs.base_path }}" \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http:\/\/lsrz\.cs\.mfa\.gov\.cn/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

      # 供自有服务器部署使用的普通 artifact
      # 开关：仓库 Settings → Secrets and variables → Actions → Variables → DEPLOY_TO_SERVER
      - name: Upload site for self-hosted server
        if: ${{ vars.DEPLOY_TO_SERVER == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: "_site${{ steps.pages.outputs.base_path }}"
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # rsync 推送到火山引擎服务器
  # 开关：仓库 Settings → Secrets and variables → Actions → Variables
  #       把 DEPLOY_TO_SERVER 设为 false 即可停止推送（服务器到期后用它）
  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TO_SERVER == 'true' }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 115.190.250.120 >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          rsync -rltz --delete \
            --no-owner --no-group --no-perms \
            --exclude='.user.ini' \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='proxy_cache_dir/' \
            --chmod=D775,F664 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            _site/ deploy@115.190.250.120:/www/wwwroot/2019527.xyz/ \
            || { code=$?; if [ "$code" -eq 23 ]; then echo "rsync 退出码 23：部分属性未能设置（宝塔保护 .user.ini 等文件所致），文件内容已传输完成，视为成功"; else exit $code; fi; }

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
