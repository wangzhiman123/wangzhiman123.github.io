# ============================================================================
# 【本文件是什么？】
# 这是 GitHub Actions 的「自动构建并上线」配置。
# ----------------------------------------------------------------------------
# GitHub Actions 可以理解为 GitHub 免费提供的"云端机器人"：
# 您只要把写好的文章推到 GitHub 网站，这个机器人就会自动帮您：
#   ① 把 Markdown 文章编译成真正的网页
#   ② 检查网页有没有坏掉的链接
#   ③ 把网页发布到网上（GitHub Pages，以及可选的您自己的服务器）
#
# 一句话概括运行效果：
#   您在本地改完文章、推送到 GitHub → 等两三分钟 → 网站就自动更新好了，
#   全程不需要您做任何手工操作。
#
# 本文件分两段（下面 jobs 里的两个名字）：
#   build   —— 编译网站并打包，是整个流程的基础
#   deploy  —— 把编译结果发布到 GitHub Pages
#
# 【2026-10-27 精简】原来还有第三个任务 deploy-server（用 rsync 把网页同步到
# 自己的国内云服务器）。该功能已整体移除，连同打包上传、SSH 密钥、
# DEPLOY_TO_SERVER 开关一起删掉了。现在只发布到 GitHub Pages 一个地方。
#
# 阅读提示：YAML 格式靠缩进表示层级，缩进对不齐会直接报错。
# ============================================================================

name: "Build and Deploy"
# 这个自动化流程的名字，会显示在 GitHub 网站的 Actions 页面上。

# ---------------------- 什么时候自动运行 ----------------------
on:
  # 触发条件 1：有人向 main 分支推送代码时自动运行
  push:
    branches:
      - main
      # 只有 main 分支的推送才触发（其他分支不影响线上网站）。
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      # 【小优化】如果这次改动只涉及这三个文件，就不用重新构建网站了——
      # 因为它们的内容跟网页显示毫无关系，白跑一次浪费时间。

  # 触发条件 2：手动点击运行
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    # 加上这一段后，GitHub 的 Actions 页面会出现「Run workflow」按钮，
    # 您可以随时手动点一下让它跑一遍（例如刚改完想立刻上线）。
    inputs:
      branch:
        description: >-
          要构建的分支，默认 main。
          说明：GitHub「Run workflow」界面右上角本身就有分支下拉框，界面上选的分支即本次运行的 ref；
          这个参数主要用于 gh workflow run / REST API 触发时显式指定，默认留空即为 main。
        required: false
        # required: false 表示可以不填。
        default: 'main'
        # 不填就用 main。
        type: string
      environment:
        description: >-
          部署目标环境名。GitHub Pages 官方固定使用 github-pages（环境里记录了部署历史与线上地址），
          一般不要改动；仅在你另外配置了自定义环境时才需要切换。
        required: false
        default: 'github-pages'
        type: choice
        # type: choice 表示这是一个下拉选择框，只能从下面 options 里选。
        options:
          - github-pages

# ---------------------- 权限声明 ----------------------
permissions:
  # 这一段是在告诉 GitHub："这次自动化任务需要用到这些权限，请授权"。
  # 权限给得越精准，安全性越高（万一配置被篡改，能做的坏事也有限）。
  contents: read
  # 只读仓库内容（读取文章、代码）。
  pages: write
  # 允许发布网页到 GitHub Pages（必须给，否则发不出去）。
  id-token: write
  # 允许获取一个临时凭证，供 GitHub Pages 验证身份用（新版官方要求）。
  # 【2026-10-27】原来这里还有 actions: write，是为「给自有服务器打包上传」用的；
  # 那个任务已删除，这行权限也就不再需要，去掉可以让脚本的权限更小更安全。

# Allow one concurrent deployment
# 不取消进行中的运行，保证最后一次提交一定被部署上线
concurrency:
  # concurrency = 并发控制，用来规定"同一个任务不要同时跑好几遍"。
  group: "pages"
  # 把发布任务都归到 pages 这一个队列里，排队执行。
  cancel-in-progress: false
  # 【这一项的选择很关键】false = 新任务等旧任务跑完再开始，不打断旧的。
  # 好处是：如果您一口气推了好几次改动，最后一次一定会上线，
  # 不会出现"最旧的版本把最新的覆盖掉"这种糟心事。

# ---------------------- 三个任务 ----------------------
jobs:

  # ==================== 任务一：编译网站 ====================
  build:
    # 这是最核心的任务，产出"编译好的网站文件"，后面两个部署任务都要用它。
    runs-on: ubuntu-latest
    # 在 GitHub 提供的 Ubuntu Linux 云主机上运行（免费额度内不花钱）。

    steps:
      # steps = 一步步要做的事情，按顺序执行。

      - name: Checkout
        # 第 1 步：把仓库里的代码下载到这台云主机上。
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 【为什么写 0？】默认只下载最近一次记录（浅克隆），快但信息不全。
          # 写 0 表示"下载完整历史"。本项目的 _plugins/posts-lastmod-hook.rb
          # 需要通过 Git 历史来判断文章什么时候改过，所以必须拿全历史，
          # 否则"更新于 xxx"会显示不出来。

      - name: Setup Pages
        # 第 2 步：读取 GitHub Pages 的配置信息。
        id: pages
        # 给这一步起个代号叫 pages，后面可以用 steps.pages.outputs.base_path 取到它读出来的结果（网站子路径）。
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        # 第 3 步：准备 Ruby 运行环境（Jekyll 是用 Ruby 写的）。
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          # 使用 Ruby 3.4 版本。
          bundler-cache: true
          # 自动缓存并安装项目需要的组件（依赖包），
          # 有缓存后第二次运行会快很多。

      - name: Build site
        # 第 4 步：真正开始"把文章编译成网页"。
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        # 这条命令的意思是：
        #   bundle exec  —— 用项目里指定的工具版本来执行；
        #   jekyll b     —— b 是 build（构建）的简写；
        #   -d "输出的文件夹" —— 把生成的网页放到 _site 目录里。
        env:
          JEKYLL_ENV: "production"
          # 声明当前是"正式环境"。
          # 【作用】开启正式环境的优化策略，比如 _config.yml 里的 compress_html
          # 就会把网页压缩瘦身，让访客打开更快。

      # 链接检查只告警、不阻断发布：网页端写作时偶发的坏链/缺图不应导致整站无法上线
      - name: Test site
        # 第 5 步：自动检查生成的网页里有没有打不开的链接。
        continue-on-error: true
        # 【关键设置】即使这一步发现问题，也不中断整个流程。
        # 原因：写文章时偶尔少写一个图、贴错一条链接是常事，
        # 不该因为这点小毛病就让整站无法更新。
        run: |
          bundle exec htmlproofer "_site${{ steps.pages.outputs.base_path }}" \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http:\/\/lsrz\.cs\.mfa\.gov\.cn/"
        # htmlproofer 是一个专门检查链接的工具。两个参数的含义：
        #   --disable-external —— 只检查网站内部链接，不检查外站链接。
        #       为什么要这样？因为外站偶尔维护、访问慢，我们不希望因为
        #       别人的网站打不开，就说自己的网站有问题。而且也能加快检查速度。
        #   --ignore-urls     —— 忽略这几个"本地调试地址"，
        #       它们在正式网站上本来就不该存在，检查出来也没有意义。

      - name: Upload site artifact
        # 第 6 步：把编译好的网站打包上传，交给后面的发布任务使用。
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"
          # 要打包上传的文件夹。

  # ==================== 任务二：发布到 GitHub Pages ====================
  deploy:
    # 这个任务负责把网站发布到 GitHub 免费提供的托管服务上。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      # 指定所属"环境"名称，并记录发布后的网址。
      # 好处：GitHub 仓库首页右侧会显示一个"访问网站"的链接，点一下就能打开网站。
    runs-on: ubuntu-latest
    needs: build
    # needs: build 表示"必须等 build 任务成功完成后，才能开始本任务"。
    # 这是任务之间的依赖关系，保证不会发布半成品。
    steps:
      - name: Deploy to GitHub Pages
        # 把上一步打包好的网站正式发布上线。
        id: deployment
        uses: actions/deploy-pages@v5

  # 【2026-10-27 精简】原来这里还有「任务三：同步到自己的服务器」：
  #   用 rsync + SSH 私钥把编译结果推到 115.190.250.120 那台云服务器上的
  #   /www/wwwroot/2019527.xyz/，由 DEPLOY_TO_SERVER 变量控制开关。
  # 该功能已整体移除（deploy/ 目录也一并删除），现在只发布到 GitHub Pages。
  # ⚠️ 若以后还要用国内服务器托管，需要把这一段连同 deploy/ 工具一起恢复。